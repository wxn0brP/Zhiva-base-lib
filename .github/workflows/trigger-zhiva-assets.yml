name: Trigger zhiva-assets

on:
  push:
    paths:
      - "assets/**"

  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger workflow in zhiva-assets
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          repository: wxn0brP/zhiva-assets
          event-type: zhiva-assets-deploy
